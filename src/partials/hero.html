<header class="hero-section">
  <div class="hero-content">
    <h1>ORGANIC VEGETABLES TO YOUR DIET TODAY!</h1>
    <p>
      Our expertly curated vegetable baskets are made with the freshest,
      highest quality vegetables available. Fresh Harvest Box has got you
      covered. Fresh, high-quality vegetables in expertly curated
      vegetable baskets delivered to you.
    </p>
  </div>

  <div class="hero-image">
    <picture>
      <source
        srcset="
          ./src/images/hero-img.jpg    1x,
          ./src/images/hero-img@2x.jpg 2x
        "
        media="(min-width: 1280px)"
      />
      <source
        srcset="
          ./src/images/hero-tablet.jpg    1x,
          ./src/images/hero-tablet@2x.jpg 2x
        "
        media="(min-width: 768px)"
      />
      <img
        srcset="
          ./src/images/hero-mobile.jpg    1x,
          ./src/images/hero-mobile@2x.jpg 2x
        "
        src="./src/images/hero-mobile.jpg"
        alt="Fresh organic vegetables"
      />
    </picture>
  </div>
</header>
