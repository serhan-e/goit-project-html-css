<section class="hero">
  <picture>
    <source
      media="(min-width: 1280px)"
      srcset="
        src/images/basket-desktop.jpg    1x,
        src/images/basket-desktop@2x.jpg 2x
      "
    />
    <source
      media="(min-width: 768px)"
      srcset="
        src/images/basket-tablet.jpg    1x,
        src/images/basket-tablet@2x.jpg 2x
      "
    />
    <img
      srcset="
        src/images/basket-mobile.jpg    1x,
        src/images/basket-mobile@2x.jpg 2x
      "
      src="src/images/basket-mobile.jpg"
      alt="Vegetable basket"
    />
  </picture>
</section>
